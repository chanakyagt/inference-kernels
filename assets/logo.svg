  <g fill="#ffffff" opacity="0.9">
    <rect x="102" y="44" width="16" height="16" rx="3"/><rect x="122" y="44" width="16" height="16" rx="3" opacity="0.6"/><rect x="142" y="44" width="16" height="16" rx="3"/>
    <rect x="102" y="64" width="16" height="16" rx="3" opacity="0.6"/><rect x="122" y="64" width="16" height="16" rx="3"/><rect x="142" y="64" width="16" height="16" rx="3" opacity="0.6"/>
  </g>
  <path d="M133 88 L118 116 L131 116 L124 140 L148 106 L135 106 L142 88 Z" fill="#FDE047"/>
  <!-- wordmark -->
  <text x="200" y="100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#16A34A" letter-spacing="-1">inference<tspan fill="#7C3AED">-kernels</tspan></text>
  <text x="203" y="144" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#94A3B8" letter-spacing="3">FUSED · TRITON · CUDA</text>
</svg>
