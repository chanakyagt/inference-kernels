<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <linearGradient id="k1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#84CC16"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="k2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <!-- three separate kernels on the left collapse into one fused kernel on the right -->
  <rect x="14" y="30" width="34" height="34" rx="7" fill="url(#k1)" opacity="0.45"/>
  <rect x="14" y="73" width="34" height="34" rx="7" fill="url(#k1)" opacity="0.7"/>
  <rect x="14" y="116" width="34" height="34" rx="7" fill="url(#k1)"/>
  <path d="M56 47 L84 78 M56 90 L84 90 M56 133 L84 102" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  <rect x="90" y="30" width="80" height="120" rx="14" fill="url(#k2)"/>
